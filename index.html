    <title>Marmita Hub</title>
    <script>
      // Suppress benign ResizeObserver warning triggered by Radix UI components.
      (function(){
        var msgs=["ResizeObserver loop completed with undelivered notifications.","ResizeObserver loop limit exceeded"];
        function silence(e){
          var m = (e && (e.message || (e.reason && e.reason.message))) || "";
          if(msgs.some(function(x){return m.indexOf(x) !== -1;})){
            e.stopImmediatePropagation();
            if(typeof e.preventDefault === "function") e.preventDefault();
            return true;
          }
          return false;
        }
        window.addEventListener("error", silence, true);
        window.addEventListener("unhandledrejection", silence, true);
      })();
    </script>
